[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "talend_cli"
version = "0.1.0"
description = "CLI for running Talend Cloud jobs"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[project.scripts]
talend_cli = "talend_etl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
